<!DOCTYPE html>
<!--
  FLASHCARDS  (part of Teacher Apps)
  =================================================================
  One self-contained file: structure (HTML), look (CSS) and
  behaviour (JavaScript) all live here. Nothing is loaded from the
  internet and nothing is sent anywhere. Decks are saved as .json
  files that you choose where to keep.

  How the file is laid out:
    1. <style>  ... design tokens, then one block per part of the page
    2. <body>   ... Teacher Apps header, Study view, Manage view,
                    the New / Edit card dialog, the save toast
    3. <script> ... everything that makes it work
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards · Teacher Apps</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231C2730'/%3E%3Crect x='8' y='8' width='10.5' height='10.5' rx='3' fill='%237FA6F0'/%3E%3Ccircle cx='26.75' cy='13.25' r='5.25' fill='%235FC49A'/%3E%3Crect x='8' y='21.5' width='10.5' height='10.5' rx='3' fill='%23E2AB4C'/%3E%3Crect x='21.5' y='21.5' width='10.5' height='10.5' rx='3' fill='%23EEF2F1'/%3E%3C/svg%3E">

<style>
/* =================================================================
   1. DESIGN TOKENS
   Shared Teacher Apps colours, plus this app's own colour (green).
   ================================================================= */
:root {
  --paper:      #F5F7F6;  /* page background */
  --surface:    #FFFFFF;  /* cards, dialogs */
  --surface-2:  #EEF2F1;  /* subtle fills */
  --ink:        #1C2730;  /* main text */
  --ink-2:      #4A5862;  /* secondary text (about 7:1 contrast) */
  --rule:       #D3DBDA;  /* light dividing lines */
  --field-edge: #85918F;  /* input and outline-button borders */
  --focus:      #1D5FD1;  /* keyboard focus ring */
  --warn:       #A3360F;  /* "unsaved changes" text */

  --app:        #2A8462;  /* Flashcards green: stripe, main buttons */
  --app-bg:     #CDEBDD;  /* soft green tint */
  --app-dark:   #1F6B4E;  /* hover state for green buttons */

  --radius:     12px;
  --radius-lg:  20px;
  --flip-time:  0.5s;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}

/* =================================================================
   2. BASICS
   ================================================================= */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.5;
}
h1, h2, h3, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Hides text visually but keeps it for screen readers. */
.sr-only {
  position: absolute !important; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px;
  border-radius: 999px; border: 1px solid var(--field-edge);
  background: var(--surface); color: var(--ink);
  font-size: 0.9375rem; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn svg { flex: none; }
.btn-primary { background: var(--app); border-color: var(--app); color: #FFFFFF; }
.btn-primary:hover { background: var(--app-dark); border-color: var(--app-dark); }
.btn-big { min-height: 52px; padding: 0 24px; font-size: 1.0625rem; }
.btn-dashed { border: 2px dashed var(--field-edge); background: transparent; }
.icon-btn {
  width: 36px; height: 36px; border: 0; border-radius: 10px;
  background: transparent; color: var(--ink-2);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* =================================================================
   3. TEACHER APPS HEADER
   Coloured stripe, logo (link home), app icon + name, view tabs.
   ================================================================= */
.app-stripe { height: 4px; background: var(--app); }
.app-bar { border-bottom: 1px solid var(--rule); }
.app-bar-inner {
  max-width: 1120px; margin: 0 auto; padding: 14px 24px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 12px 24px;
}
.app-id { display: flex; align-items: center; gap: 14px; }
.home-link { display: inline-flex; border-radius: 10px; }
.logo-mark {
  width: 32px; height: 32px; padding: 6px; border-radius: 9px;
  background: #1C2730;
  display: grid; grid-template-columns: 1fr 1fr; gap: 3px;
}
.logo-mark span:nth-child(1) { background: #7FA6F0; border-radius: 3px 3px 3px 1.5px; }
.logo-mark span:nth-child(2) { background: #5FC49A; border-radius: 50%; }
.logo-mark span:nth-child(3) { background: #E2AB4C; border-radius: 3px; }
.logo-mark span:nth-child(4) { background: #EEF2F1; border-radius: 3px 1.5px 3px 3px; }
.bar-divider { width: 1px; height: 24px; background: var(--rule); }
.app-name { display: inline-flex; align-items: center; gap: 10px; font-size: 1.125rem; font-weight: 700; letter-spacing: -0.01em; }
.app-icon {
  width: 32px; height: 32px; border-radius: 9px; background: var(--app-bg);
  display: inline-flex; align-items: center; justify-content: center;
}
.app-icon svg { stroke: var(--app); }

/* Study / Manage tabs: a two-part pill switch. */
.view-tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface-2); }
.view-tabs button {
  min-height: 38px; padding: 0 18px; border: 0; border-radius: 999px;
  background: transparent; color: var(--ink-2);
  font-size: 0.9375rem; font-weight: 600; cursor: pointer;
}
.view-tabs button.active { background: var(--app-bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--app); }

.header-deck { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9375rem; color: var(--ink-2); min-height: 24px; }

/* =================================================================
   4. VIEWS (only one is shown at a time)
   ================================================================= */
.view { display: none; }
.view.active { display: block; }
.page { max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; }

/* ---- Empty / finished messages ---- */
.message {
  max-width: 560px; margin: 32px auto 0; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.message-icon {
  width: 88px; height: 88px; border-radius: 50%; background: var(--app-bg);
  display: flex; align-items: center; justify-content: center;
}
.message-icon svg { stroke: var(--app); }
.message h2 { font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 750; letter-spacing: -0.02em; line-height: 1.15; }
.message p { font-size: 1.125rem; color: var(--ink-2); }
.message-actions { margin-top: 8px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

/* =================================================================
   5. STUDY VIEW
   ================================================================= */
.study { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.study-top { width: 100%; max-width: 760px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.progress-label { font-size: 0.9375rem; color: var(--ink-2); }
.progress-label strong { color: var(--ink); }
.shuffle-btn { min-height: 40px; padding: 0 16px; font-size: 0.875rem; }
.shuffle-btn[aria-pressed="true"] { background: var(--app-bg); border-color: var(--app); }

/* One tick per card; green ticks are cards you've got. */
.ticks { width: 100%; max-width: 760px; display: flex; gap: 4px; }
.ticks span { flex: 1; height: 8px; border-radius: 999px; background: var(--rule); }
.ticks span.done { background: var(--app); }

/* ---- The card: a 3D flip ----
   .card-scene is the "camera", .card-inner rotates, and the two
   faces sit back to back with their backs hidden. */
.card-scene {
  width: 100%; max-width: 760px; height: clamp(320px, 52vh, 440px);
  perspective: 1400px;
  padding: 0; border: 0; background: none; cursor: pointer; text-align: center;
  border-radius: 28px;
}
.card-inner {
  position: relative; display: block; width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform var(--flip-time) ease;
}
.card-inner.flipped { transform: rotateY(180deg); }
@media (prefers-reduced-motion: reduce) { .card-inner { transition: none; } }
.card-face {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center; gap: 16px;
  padding: 28px 32px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 28px;
  box-shadow: 0 2px 4px rgba(28,39,48,0.05), 0 32px 64px -32px rgba(28,39,48,0.35);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.card-face.back { transform: rotateY(180deg); border-top: 6px solid var(--app); }
.face-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
.face-label { padding: 4px 12px; border-radius: 999px; background: var(--surface-2); font-size: 0.8125rem; font-weight: 700; }
.back .face-label { background: var(--app-bg); }
.face-count { font-size: 0.875rem; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.card-text {
  display: flex; align-items: center; justify-content: center;
  flex: 1; min-height: 0; width: 100%; overflow: auto;
  overflow-wrap: anywhere; white-space: pre-wrap;
}
.front .card-text { font-size: clamp(1.75rem, 4.5vw, 3.25rem); font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; }
.back .card-text  { font-size: clamp(1.25rem, 2.6vw, 1.875rem); font-weight: 600; line-height: 1.35; }
.card-text img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 12px; }
.hint { font-size: 0.875rem; color: var(--ink-2); }

.rating { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.kbd-hint { font-size: 0.875rem; color: var(--ink-2); }
kbd {
  font: inherit; font-size: 0.8125rem; font-weight: 600;
  padding: 1px 7px; border-radius: 6px; border: 1px solid var(--rule); border-bottom-width: 2px;
  background: var(--surface);
}

/* =================================================================
   6. MANAGE VIEW
   ================================================================= */
.manage { display: flex; flex-direction: column; gap: 28px; }
.block-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.small-heading { font-size: 0.9375rem; font-weight: 700; color: var(--ink-2); }

/* ---- Deck buttons ---- */
.deck-bar { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.deck-pill {
  display: inline-flex; align-items: stretch;
  border-radius: 999px; border: 1px solid var(--rule); background: var(--surface);
}
.deck-pill.active { background: var(--app); border-color: var(--app); color: #FFFFFF; }
.deck-select {
  display: inline-flex; align-items: center; gap: 10px;
  min-height: 44px; padding: 0 8px 0 18px; border: 0; border-radius: 999px;
  background: transparent; color: inherit; font-weight: 600; cursor: pointer;
}
.deck-pill.no-close .deck-select { padding-right: 18px; }
.deck-count { font-weight: 500; color: var(--ink-2); }
.deck-pill.active .deck-count { color: #DFF3EA; }
.unsaved-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.deck-pill.active .unsaved-dot { background: #FFD9C9; }
.deck-close {
  width: 36px; margin: 4px 4px 4px 0; border: 0; border-radius: 999px;
  background: transparent; color: inherit; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.deck-close:hover { background: rgba(28,39,48,0.08); }
.deck-pill.active .deck-close:hover { background: rgba(255,255,255,0.18); }

/* ---- Cards in the open deck ---- */
.cards-head {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px;
  padding-top: 24px; border-top: 1px solid var(--rule);
}
.cards-head h2 { font-size: 1.875rem; font-weight: 750; letter-spacing: -0.02em; line-height: 1.15; overflow-wrap: anywhere; }
.context-label { margin-top: 4px; font-size: 0.9375rem; color: var(--ink-2); }
.context-label .is-unsaved { color: var(--warn); font-weight: 600; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; }

.card-list {
  list-style: none; margin: 16px 0 0; padding: 0;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px;
}
.card-item {
  background: var(--surface); border: 1px solid var(--rule); border-radius: 18px;
  padding: 14px 16px 18px 20px; display: flex; flex-direction: column; gap: 4px;
  cursor: grab;
}
.card-item.dragging { opacity: 0.4; }
.card-item.drop-target { border-color: var(--app); box-shadow: 0 0 0 2px var(--app-bg); }
.card-item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-num { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.card-num svg { stroke: var(--field-edge); }
.card-actions { display: flex; gap: 2px; }
.card-front { font-size: 1.125rem; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.card-back { margin-top: 2px; font-size: 0.9375rem; color: var(--ink-2); overflow-wrap: anywhere; }
.card-item img { display: block; max-width: 100%; max-height: 96px; border-radius: 10px; background: var(--surface-2); }
.empty-manage { margin-top: 16px; padding: 40px 24px; border: 2px dashed var(--rule); border-radius: var(--radius-lg); text-align: center; color: var(--ink-2); }

/* =================================================================
   7. NEW / EDIT CARD DIALOG
   ================================================================= */
.modal-overlay {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(28,39,48,0.45);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 72px 24px 24px; overflow: auto;
}
.modal-box {
  width: 100%; max-width: 560px;
  background: var(--surface); border-radius: 24px; padding: 28px;
  display: flex; flex-direction: column; gap: 20px;
  box-shadow: 0 40px 80px -30px rgba(0,0,0,0.5);
}
.modal-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.modal-header h2 { font-size: 1.375rem; font-weight: 750; letter-spacing: -0.01em; }
.modal-close { width: 40px; height: 40px; border-radius: 999px; background: var(--surface-2); }
.field-label { display: block; margin-bottom: 6px; font-size: 0.875rem; font-weight: 600; color: var(--ink-2); }
.drop-zone { border-radius: var(--radius); }
.drop-zone textarea {
  display: block; width: 100%; min-height: 84px; resize: vertical;
  padding: 12px 14px; border: 1px solid var(--field-edge); border-radius: var(--radius);
  background: var(--surface);
}
.drop-hint {
  margin-top: 8px; min-height: 52px; padding: 8px 12px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 8px;
  border: 2px dashed var(--rule); border-radius: var(--radius);
  font-size: 0.875rem; color: var(--ink-2); text-align: center;
}
.drop-hint svg { stroke: var(--ink-2); }
.choose-file { padding: 0; border: 0; background: none; color: var(--ink); font-weight: 600; text-decoration: underline; cursor: pointer; }
.drop-zone.drag-over .drop-hint,
.drop-zone.drag-over textarea { border-color: var(--app); background: var(--app-bg); }
.drop-zone img { display: block; max-width: 100%; max-height: 220px; margin: 0 auto; border-radius: var(--radius); border: 1px solid var(--rule); }
.clear-img-btn {
  display: block; margin: 10px auto 0; min-height: 36px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--field-edge); background: var(--surface);
  font-size: 0.875rem; font-weight: 600; cursor: pointer;
}
.modal-actions { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.modal-actions .right { display: flex; gap: 8px; margin-left: auto; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--ink-2); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--app); }

/* =================================================================
   8. SAVE TOAST
   ================================================================= */
#save-toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 20;
  transform: translate(-50%, 12px);
  padding: 12px 20px; border-radius: 999px;
  background: var(--ink); color: #FFFFFF; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
#save-toast.visible { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 640px) {
  .page { padding-top: 28px; }
  .card-face { padding: 20px; }
  .header-deck { display: none; }
}
</style>
</head>

<body>

<!-- =================================================================
     TEACHER APPS HEADER
     ================================================================= -->
<div class="app-stripe" aria-hidden="true"></div>
<header class="app-bar">
  <div class="app-bar-inner">
    <div class="app-id">
      <a class="home-link" href="index.html" aria-label="Teacher Apps home">
        <span class="logo-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      </a>
      <span class="bar-divider" aria-hidden="true"></span>
      <h1 class="app-name">
        <span class="app-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="13" rx="2.5"/><path d="M7 3.5h11.5A2.5 2.5 0 0 1 21 6v11"/></svg></span>
        Flashcards
      </h1>
    </div>
    <nav class="view-tabs" aria-label="Flashcards views">
      <button type="button" id="tab-study" class="active" aria-pressed="true" onclick="showView('study')">Study</button>
      <button type="button" id="tab-manage" aria-pressed="false" onclick="showView('manage')">Manage</button>
    </nav>
    <!-- Name of the deck being used. renderContextLabel() fills it. -->
    <p class="header-deck" id="header-deck"></p>
  </div>
</header>

<main>

  <!-- =================================================================
       STUDY VIEW
       Studies the active deck (or the unsaved cards if no deck is open).
       ================================================================= -->
  <section id="view-study" class="view active" aria-label="Study">
    <div class="page">

      <!-- Shown when there is nothing to study. initStudy() writes the text. -->
      <div id="empty-study" class="message">
        <span class="message-icon" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="13" rx="2.5"/><path d="M7 3.5h11.5A2.5 2.5 0 0 1 21 6v11"/></svg></span>
        <h2 id="empty-study-title">No cards yet</h2>
        <p id="empty-study-text">Go to Manage to open a deck or add cards.</p>
        <div class="message-actions">
          <button type="button" class="btn btn-primary btn-big" onclick="showView('manage')">Go to Manage</button>
        </div>
      </div>

      <!-- Shown when every card in the session is done. -->
      <div id="study-done" class="message" hidden>
        <span class="message-icon" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
        <h2 id="done-title">Nice work.</h2>
        <p id="done-text"></p>
        <div class="message-actions">
          <button type="button" id="btn-tricky" class="btn btn-big" onclick="studyTricky()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v6h6"/><path d="M5 15a8 8 0 1 0 2-8.5L4 10"/></svg>
            <span id="btn-tricky-label">Practice the tricky ones</span>
          </button>
          <button type="button" class="btn btn-primary btn-big" onclick="initStudy()">Study all again</button>
        </div>
      </div>

      <!-- The study session itself. -->
      <div id="study-deck" class="study" hidden>
        <div class="study-top">
          <p class="progress-label" id="progress-label" aria-live="polite"></p>
          <button type="button" id="btn-shuffle" class="btn shuffle-btn" aria-pressed="false" onclick="toggleShuffle()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
            <span id="shuffle-label">Shuffle off</span>
          </button>
        </div>
        <div class="ticks" id="ticks" aria-hidden="true"></div>

        <!-- Click (or Space) flips the card. -->
        <button type="button" class="card-scene" id="card-scene" onclick="flipCard()" aria-describedby="flip-hint">
          <span class="card-inner" id="card-inner">
            <span class="card-face front">
              <span class="face-top"><span class="face-label">Front</span><span class="face-count" id="face-count-front"></span></span>
              <span class="card-text" id="card-front-content"></span>
              <span class="hint" id="flip-hint">Click the card or press Space to flip</span>
            </span>
            <span class="card-face back" aria-hidden="true">
              <span class="face-top"><span class="face-label">Back</span><span class="face-count" id="face-count-back"></span></span>
              <span class="card-text" id="card-back-content"></span>
              <span class="hint">How did you do?</span>
            </span>
          </span>
        </button>

        <div id="rating-buttons" class="rating" hidden>
          <button type="button" class="btn btn-big" onclick="rateCard(false)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v6h6"/><path d="M5 15a8 8 0 1 0 2-8.5L4 10"/></svg>
            Review again
          </button>
          <button type="button" class="btn btn-primary btn-big" onclick="rateCard(true)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
            Got it
          </button>
        </div>
        <p class="kbd-hint" id="kbd-hint">Keyboard: <kbd>Space</kbd> to flip</p>
      </div>

    </div>
  </section>

  <!-- =================================================================
       MANAGE VIEW
       Top: your decks. Below: the cards in the open deck.
       ================================================================= -->
  <section id="view-manage" class="view" aria-label="Manage">
    <div class="page manage">

      <div>
        <div class="block-head">
          <h2 class="small-heading">Your decks</h2>
          <button type="button" class="btn" onclick="openLoadDecks()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg>
            Open deck file
          </button>
        </div>
        <!-- Hidden file picker used by browsers without showOpenFilePicker (e.g. Firefox). -->
        <input type="file" id="deck-load-input" multiple accept=".json,application/json" hidden onchange="loadDecks(event)">
        <!-- renderDeckBar() fills this with one button per deck. -->
        <div class="deck-bar" id="deck-bar"></div>
      </div>

      <div>
        <div class="cards-head">
          <div>
            <h2 id="manage-deck-title">Unsaved cards</h2>
            <p class="context-label" id="manage-context-label"></p>
          </div>
          <div class="toolbar">
            <button type="button" class="btn" onclick="saveAsJSON()">Save as…</button>
            <button type="button" class="btn" onclick="exportJSON()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
              Save deck
            </button>
            <button type="button" class="btn btn-primary" onclick="openAddModal()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>

        <div class="empty-manage" id="empty-manage" hidden></div>

    </div>
  </section>

</main>

<!-- =================================================================
     NEW / EDIT CARD DIALOG
     editIndex in the script decides the mode:

       a number → Edit card (Save replaces that card)
     ================================================================= -->
<div class="modal-overlay" id="card-modal" hidden onclick="if (event.target === this) closeModal()">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">

        <div class="drop-hint">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
          Or drop an image here, or <button type="button" class="choose-file" onclick="document.getElementById('file-modal-front').click()">choose a file</button>
        </div>
        <input type="file" id="file-modal-front" accept="image/*" hidden>

      <label class="field-label" for="text-modal-back">Back</label>
      <div class="drop-zone" id="drop-modal-back">
        <textarea id="text-modal-back" rows="3" placeholder="Answer, definition or label"></textarea>
        <div class="drop-hint">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
          Or drop an image here, or <button type="button" class="choose-file" onclick="document.getElementById('file-modal-back').click()">choose a file</button>
        </div>
        <input type="file" id="file-modal-back" accept="image/*" hidden>

    <div class="modal-actions">
      <!-- Only shown when adding cards: keeps the dialog open for the next one. -->
      <label class="check" id="add-another-row"><input type="checkbox" id="add-another" checked> Add another after saving</label>
      <div class="right">
        <button type="button" class="btn" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" id="modal-save-btn" onclick="saveModal()">Save card</button>

<!-- SAVE TOAST: shown briefly after a save. showToast() toggles .visible. -->
<div id="save-toast" role="status" aria-live="polite"></div>

<script>

    /*
     * ============================================================
     * FLASHCARDS — JavaScript
     * ============================================================
     *
     * DECK SYSTEM
     * -----------
     * decks[]        — array of loaded deck objects, each:
     *                  { name: string, cards: [], dirty: boolean }
     *                  name  = filename without .json
     *                  cards = array of card objects
     *                  dirty = true when cards changed since last Save
     *
     * activeDeckIdx  — integer:
     *                  -1   = no deck selected (scratchpad mode)
     *                  0+   = index of active deck in decks[]
     *
     * scratchCards   — cards created while no deck is active;
     *                  not backed by any file
     *
     * cards          — always a reference to the currently active
     *                  cards array. Updated by syncCards() on every
     *                  deck switch. All card-level functions use this
     *                  variable so they work correctly in both modes.
     *
     * Card object shape:
     *   { id, front, back, frontImg, backImg, interval }
     * ============================================================
     */


    /* -----------------------------------------------------------
     * DATA STORE
     * ----------------------------------------------------------- */

    var decks         = [];           /* array of { name, cards, dirty } */
    var activeDeckIdx = -1;           /* -1 = scratchpad; 0+ = index in decks[] */
    var scratchCards  = [];           /* unsaved cards with no deck */
    var cards         = scratchCards; /* reference to the active cards array */


    /* syncCards updates the `cards` reference to point at the correct array.
       Because `cards` is a reference, pushing or splicing through it
       also modifies the underlying deck or scratchpad array directly. */
    function syncCards() {
      cards = activeDeckIdx >= 0 ? decks[activeDeckIdx].cards : scratchCards;
    }

    /* isDirty — true when the active file-backed deck has unsaved changes.
       Scratchpad is handled separately (it has no file to compare against). */
    function isDirty() {
      return activeDeckIdx >= 0 && decks[activeDeckIdx].dirty;
    }

    /* markDirty — call after any add, edit, delete, or reorder */
    function markDirty() {
      if (activeDeckIdx >= 0) decks[activeDeckIdx].dirty = true;
    }

    /* clearDirty — call after a successful Save Deck export */
    function clearDirty() {
      if (activeDeckIdx >= 0) decks[activeDeckIdx].dirty = false;
    }


    /* -----------------------------------------------------------
     * DECK MANAGEMENT
     * ----------------------------------------------------------- */

    /* setActiveDeck switches focus to the deck at idx (-1 = scratchpad).
       No warning on switch — changes persist in memory even when a deck
       is not active, so nothing is actually lost by switching away.
       The dirty indicator (red dot on the deck card) is the signal
       to the user that unsaved changes exist; they can save whenever ready. */
    function setActiveDeck(idx) {
      if (idx === activeDeckIdx) return; /* already on this one — do nothing */

      activeDeckIdx = idx; /* update the index */
      syncCards();          /* point `cards` at the new active array */
      renderDeckBar();
      renderManageList();
      renderContextLabel();
      initStudy();
    }



    /* openLoadDecks is called by the Load Decks button.
       Chrome/Edge: uses showOpenFilePicker to get writable FileSystemFileHandles.
         Storing the handle is the key fix for the deleted-card-reappears bug:
         the old <input> path gave only a read-only File with no path -- nothing
         to write back to. With a handle, exportJSON() can write directly to the
         source file so saves actually overwrite the original.
       Firefox: falls back to clicking the hidden <input type="file"> element. */
    async function openLoadDecks() {
      if (window.showOpenFilePicker) {
        try {
          var handles = await window.showOpenFilePicker({
            multiple: true,
            types: [{ description: 'JSON Deck Files', accept: { 'application/json': ['.json'] } }]
          });
          /* use a for loop not forEach -- await inside forEach does not pause as expected */
          for (var i = 0; i < handles.length; i++) {
            var handle = handles[i];
            try {
              var file = await handle.getFile(); /* get the File object from the handle */
              var text = await file.text();       /* read its contents as a string */
              addDeckFromFileAndHandle(handle.name, text, handle); /* parse and push */
            } catch (readErr) {
              alert('Could not read "' + handle.name + '": ' + readErr.message);
            }
          }
        } catch (err) {
          if (err.name !== 'AbortError') alert('Could not open files: ' + err.message);
        }
      } else {
        document.getElementById('deck-load-input').click(); /* Firefox fallback */
      }
    }


    /* addDeckFromFileAndHandle parses a JSON text string and pushes a deck.
       Used by both load paths so the parse/deduplicate/push logic is not duplicated.
       filename -- file name with extension e.g. "deck_a.json"
       text     -- raw JSON string from the file
       handle   -- FileSystemFileHandle (Chrome) or null (Firefox)
       The handle is stored on the deck object so exportJSON() can write
       directly back to the source file on subsequent saves. */
    function addDeckFromFileAndHandle(filename, text, handle) {
      try {
        var imported = JSON.parse(text); /* JSON text -> JS array */
        if (!Array.isArray(imported)) {
          alert('"' + filename + '" is not a valid deck file.'); return;
        }
        var deckName = filename.replace(/\.json$/i, ''); /* strip .json */
        var duplicate = decks.some(function(d) { return d.name === deckName; });
        if (duplicate) {
          alert('A deck named "' + deckName + '" is already loaded.'); return;
        }
        decks.push({
          name:       deckName,
          cards:      imported,
          dirty:      false,
          fileHandle: handle || null  /* null when loaded via Firefox <input> */
        });
        if (decks.length === 1 && activeDeckIdx === -1 && scratchCards.length === 0) {
          activeDeckIdx = 0;
          syncCards();
        }
        renderDeckBar(); renderManageList(); renderContextLabel(); initStudy();
      } catch (err) {
        alert('Could not read "' + filename + '" -- make sure it is a valid FlashDeck JSON file.');
      }
    }


    /* loadDecks handles the multi-file input after the user picks JSON files.
       Each file becomes a new deck object added to decks[].
       Loading is additive — existing decks are not replaced.

       Array.from() converts the browser's FileList into a plain JS array
       so we can use forEach on it. */
    /* loadDecks handles the Firefox <input type="file"> fallback.
       Called by onchange on the hidden #deck-load-input element.
       Reads each selected file with FileReader and hands off to
       addDeckFromFileAndHandle() with null as the handle (the <input>
       path cannot provide a writable FileSystemFileHandle). */
    function loadDecks(event) {
      var files = Array.from(event.target.files); /* FileList -> plain array */
      if (!files.length) return;

      files.forEach(function(file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          /* pass null for handle -- <input> files are read-only snapshots */
          addDeckFromFileAndHandle(file.name, e.target.result, null);
        };
        reader.readAsText(file); /* read file as text; triggers reader.onload when done */
      });

      event.target.value = ''; /* reset so the same file can be re-selected if needed */
    }


    /* unloadDeck removes the deck at idx from decks[].
       Warns if the deck has unsaved changes.
       If the removed deck was active, falls back to scratchpad mode. */
    function unloadDeck(idx) {
      if (decks[idx].dirty) {
        if (!confirm(
          '"' + decks[idx].name + '" has unsaved changes.\n' +
          'Unload anyway? Changes will be lost.'
        )) return;
      }

      /* if the deck being removed is the active one, fall back to scratchpad */
      if (activeDeckIdx === idx) {
        activeDeckIdx = -1;
        syncCards();
      } else if (activeDeckIdx > idx) {
        /* active deck's index shifts down by one because an earlier item was removed */
        activeDeckIdx--;
      }

      decks.splice(idx, 1); /* remove one item at position idx */

      renderDeckBar();
      renderManageList();
      renderContextLabel();
      initStudy();
    }


    /* Small helper: an inline SVG icon as an HTML string. */
    function svgIcon(path, size) {
      size = size || 18;
      return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" ' +
             'stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" ' +
             'aria-hidden="true">' + path + '</svg>';
    }
    var ICON = {
      close: '<path d="M6 6l12 12M18 6L6 18"/>',
      plus:  '<path d="M12 5v14M5 12h14"/>',
      edit:  '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
      trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
      grip:  '<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
      file:  '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'
    };

    function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }


    /* renderDeckBar rebuilds the row of deck buttons from scratch.
       Every element is created fresh with createElement, so nothing
       inside is looked up by id (and nothing can go missing).

       Each deck is a pill with two buttons:
         .deck-select → makes this the active deck
         .deck-close  → closes (unloads) the deck, asking first if unsaved
       The "Unsaved cards" pill (cards not in any file yet) has no ×.
       The last item is always the dashed "New deck" button. */
    function renderDeckBar() {
      var bar = document.getElementById('deck-bar');
      bar.innerHTML = '';

      decks.forEach(function(deck, idx) {
        bar.appendChild(buildDeckPill(
          deck.name, deck.cards.length, deck.dirty, idx === activeDeckIdx,
          function() { setActiveDeck(idx); },
          function() { unloadDeck(idx); }
        ));
      });

      if (scratchCards.length > 0) {
        bar.appendChild(buildDeckPill(
          'Unsaved cards', scratchCards.length, true, activeDeckIdx === -1,
          function() { setActiveDeck(-1); },
          null /* no close button: these cards only live in memory */
        ));
      }

      var newBtn = document.createElement('button');
      newBtn.type = 'button';
      newBtn.className = 'btn btn-dashed';
      newBtn.innerHTML = svgIcon(ICON.plus, 16) + 'New deck';
      newBtn.onclick = newDeck;
      bar.appendChild(newBtn);
    }

    function buildDeckPill(name, count, dirty, active, onSelect, onClose) {
      var pill = document.createElement('div');
      pill.className = 'deck-pill' + (active ? ' active' : '') + (onClose ? '' : ' no-close');

      var select = document.createElement('button');
      select.type = 'button';
      select.className = 'deck-select';
      select.setAttribute('aria-pressed', active ? 'true' : 'false');
      select.onclick = onSelect;

      var nameEl = document.createElement('span');
      nameEl.textContent = name;
      select.appendChild(nameEl);

      var countEl = document.createElement('span');
      countEl.className = 'deck-count';
      countEl.textContent = count;
      select.appendChild(countEl);

      if (dirty) {
        var dot = document.createElement('span');
        dot.className = 'unsaved-dot';
        dot.title = 'Unsaved changes';
        select.appendChild(dot);
        var srText = document.createElement('span');
        srText.className = 'sr-only';
        srText.textContent = ', unsaved changes';
        select.appendChild(srText);
      }
      pill.appendChild(select);

      if (onClose) {
        var close = document.createElement('button');
        close.type = 'button';
        close.className = 'deck-close';
        close.setAttribute('aria-label', 'Close deck ' + name);
        close.innerHTML = svgIcon(ICON.close, 16);
        close.onclick = function(e) { e.stopPropagation(); onClose(); };
        pill.appendChild(close);
      }
      return pill;
    }

    /* newDeck starts a fresh set of cards. New cards that are not in a
       file yet live in "Unsaved cards"; Save deck turns them into a
       real deck file. If there are already unsaved cards, we switch to
       them rather than throwing them away. */
    function newDeck() {
      if (activeDeckIdx !== -1) setActiveDeck(-1);
      openAddModal();
    }


    /* renderContextLabel updates the deck title, the "12 cards ·
       Unsaved changes" line in Manage, and the deck name in the header. */
    function renderContextLabel() {
      var title  = document.getElementById('manage-deck-title');
      var label  = document.getElementById('manage-context-label');
      var header = document.getElementById('header-deck');

      var name, n, unsavedText;
      if (activeDeckIdx >= 0) {
        var deck = decks[activeDeckIdx];
        name = deck.name;
        n = deck.cards.length;
        unsavedText = deck.dirty ? 'Unsaved changes' : '';
      } else {
        name = scratchCards.length > 0 ? 'Unsaved cards' : 'New deck';
        n = scratchCards.length;
        unsavedText = scratchCards.length > 0 ? 'Not saved to a file yet' : '';
      }

      title.textContent = name;
      label.innerHTML = '';
      label.appendChild(document.createTextNode(plural(n, 'card')));
      if (unsavedText) {
        label.appendChild(document.createTextNode(' · '));
        var warn = document.createElement('span');
        warn.className = 'is-unsaved';
        warn.textContent = unsavedText;
        label.appendChild(warn);
      }

      header.innerHTML = '';
      if (activeDeckIdx >= 0 || scratchCards.length > 0) {
        header.innerHTML = svgIcon(ICON.file, 16);
        header.appendChild(document.createTextNode(name));
      }
    }


    /* -----------------------------------------------------------
     * VIEW SWITCHING
     * ----------------------------------------------------------- */

    function showView(name) {
      document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
      document.querySelectorAll('.view-tabs button').forEach(function(b) {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });

      document.getElementById('view-' + name).classList.add('active');
      var tab = document.getElementById('tab-' + name);
      tab.classList.add('active');
      tab.setAttribute('aria-pressed', 'true');

      if (name === 'study')  initStudy();
      if (name === 'manage') {
        renderDeckBar();
        renderManageList();
        renderContextLabel();
      }
    }


    /* Each side of a card can hold text OR one image. An image can be
       dropped on the zone or picked with "choose a file". FileReader
       turns the image into a base64 text string so it can be stored
       inside the deck's JSON file. */
    function setupDropZone(zoneId, textareaId, fileInputId) {
      var zone = document.getElementById(zoneId);

      /* dragover fires while a file hovers over the zone.
         e.preventDefault() is required or the drop event never fires. */
      zone.addEventListener('dragover', function(e) {
        e.preventDefault();
        zone.classList.add('drag-over');
      });
      zone.addEventListener('dragleave', function() {
        zone.classList.remove('drag-over');
      });
      zone.addEventListener('drop', function(e) {
        e.preventDefault();
        zone.classList.remove('drag-over');
        loadImageIntoZone(e.dataTransfer.files[0], zoneId, textareaId);
      });

      document.getElementById(fileInputId).addEventListener('change', function(e) {
        loadImageIntoZone(e.target.files[0], zoneId, textareaId);
        e.target.value = ''; /* so the same file can be picked again */
      });
    }

    function loadImageIntoZone(file, zoneId, textareaId) {
      if (!file || !file.type.startsWith('image/')) return; /* images only */
      var reader = new FileReader();
      reader.onload = function(event) {
        showImageInZone(zoneId, textareaId, event.target.result);
      };
      reader.readAsDataURL(file);
    }

    /* Shows an image preview in a zone (hiding the text box) and stores
       the base64 string on the zone's dataset, where saveModal() reads it. */
    function showImageInZone(zoneId, textareaId, imgData) {
      var zone     = document.getElementById(zoneId);
      var textarea = document.getElementById(textareaId);

      var oldImg = zone.querySelector('img');
      var oldBtn = zone.querySelector('.clear-img-btn');
      if (oldImg) oldImg.remove();
      if (oldBtn) oldBtn.remove();

      zone.dataset.imgData = imgData;
      textarea.hidden = true;
      zone.querySelector('.drop-hint').hidden = true;

      var img = document.createElement('img');
      img.src = imgData;
      img.alt = 'Card image';
      zone.appendChild(img);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = 'Remove image';
      btn.className = 'clear-img-btn';
      btn.onclick = function() { clearDropZone(zoneId, textareaId); textarea.focus(); };
      zone.appendChild(btn);
    }

    /* clearDropZone resets a zone to its empty text-box state. */
    function clearDropZone(zoneId, textareaId) {
      var zone     = document.getElementById(zoneId);
      var textarea = document.getElementById(textareaId);

      delete zone.dataset.imgData;
      var img = zone.querySelector('img');
      var btn = zone.querySelector('.clear-img-btn');
      if (img) img.remove();
      if (btn) btn.remove();

      zone.querySelector('.drop-hint').hidden = false;
      textarea.hidden = false;
      textarea.value = '';
    }


    /* -----------------------------------------------------------
     * STUDY MODE
     * ----------------------------------------------------------- */

    var studyQueue   = [];    /* cards still to go; index 0 is on screen */
    var gotItCount   = 0;
    var totalCount   = 0;
    var missedCards  = [];    /* cards marked "Review again" at least once this session */
    var shuffleOn    = false;
    var dragSrcIndex = null;  /* which card in Manage is being dragged */

    function toggleShuffle() {
      shuffleOn = !shuffleOn;
      document.getElementById('btn-shuffle').setAttribute('aria-pressed', shuffleOn ? 'true' : 'false');
      document.getElementById('shuffle-label').textContent = shuffleOn ? 'Shuffle on' : 'Shuffle off';
      initStudy();
    }

    function showStudyPart(part) {
      document.getElementById('empty-study').hidden = part !== 'empty';
      document.getElementById('study-done').hidden  = part !== 'done';
      document.getElementById('study-deck').hidden  = part !== 'deck';
    }

    /* initStudy starts a session. With no argument it studies every
       card in the active deck; given a list (the tricky cards) it
       studies just those. */
    function initStudy(onlyThese) {
      if (cards.length === 0) {
        if (activeDeckIdx >= 0) {
          document.getElementById('empty-study-title').textContent = decks[activeDeckIdx].name + ' has no cards';
          document.getElementById('empty-study-text').textContent  = 'Go to Manage to add some.';
        } else {
          document.getElementById('empty-study-title').textContent = 'No cards yet';
          document.getElementById('empty-study-text').textContent  = 'Go to Manage to open a deck file or add cards.';
        }
        showStudyPart('empty');
        return;
      }

      /* slice() copies, so taking cards out of the queue never changes the deck */
      studyQueue = Array.isArray(onlyThese) ? onlyThese.slice() : cards.slice();

      /* Fisher-Yates shuffle if shuffle mode is on */
      if (shuffleOn) {
        for (var i = studyQueue.length - 1; i > 0; i--) {
          var j    = Math.floor(Math.random() * (i + 1));
          var temp = studyQueue[i];
          studyQueue[i] = studyQueue[j];
          studyQueue[j] = temp;
        }
      }

      gotItCount  = 0;
      totalCount  = studyQueue.length;
      missedCards = [];

      showStudyPart('deck');
      loadCard();
    }

    /* Study again, but only the cards that needed a second try. */
    function studyTricky() {
      initStudy(missedCards);
    }

    function loadCard() {
      if (studyQueue.length === 0) { showDone(); return; }

      var card = studyQueue[0];
      var position = gotItCount + 1;

      document.getElementById('progress-label').innerHTML =
        '<strong>' + gotItCount + ' got it</strong> · ' + studyQueue.length + ' to go';
      document.getElementById('face-count-front').textContent = position + ' of ' + totalCount;
      document.getElementById('face-count-back').textContent  = position + ' of ' + totalCount;
      drawTicks();

      setCardContent('card-front-content', card.frontImg, card.front);
      setCardContent('card-back-content',  card.backImg,  card.back);

      /* Snap back to the front WITHOUT animating, so the answer never
         flashes past: turn the transition off, remove "flipped", force
         the browser to apply it (getBoundingClientRect), then turn the
         transition back on for the next real flip. */
      var inner = document.getElementById('card-inner');
      inner.style.transition = 'none';
      inner.classList.remove('flipped');
      inner.getBoundingClientRect();
      inner.style.transition = '';
      setFlipped(false);
    }

    /* One tick per card in the session; green = got it. */
    function drawTicks() {
      var ticks = document.getElementById('ticks');
      ticks.innerHTML = '';
      for (var i = 0; i < totalCount; i++) {
        var t = document.createElement('span');
        if (i < gotItCount) t.className = 'done';
        ticks.appendChild(t);
      }
    }

    /* Fills one card face with an image or text. */
    function setCardContent(elementId, imgData, text) {
      var el = document.getElementById(elementId);
      el.innerHTML = '';
      if (imgData) {
        var img = document.createElement('img');
        img.src = imgData;
        img.alt = 'Card image';
        el.appendChild(img);
      } else {
        el.textContent = text || '';
      }
    }

    /* Keeps everything that depends on the flip in step: the rating
       buttons, which face screen readers hear, and the keyboard hint. */
    function setFlipped(flipped) {
      document.getElementById('rating-buttons').hidden = !flipped;
      document.querySelector('.card-face.front').setAttribute('aria-hidden', flipped ? 'true' : 'false');
      document.querySelector('.card-face.back').setAttribute('aria-hidden',  flipped ? 'false' : 'true');
      document.getElementById('kbd-hint').innerHTML = flipped
        ? 'Keyboard: <kbd>1</kbd> Review again · <kbd>2</kbd> Got it · <kbd>Space</kbd> flip back'
        : 'Keyboard: <kbd>Space</kbd> to flip';
    }

    function flipCard() {
      var inner   = document.getElementById('card-inner');
      var flipped = inner.classList.toggle('flipped'); /* true if the class was added */
      setFlipped(flipped);
    }

    function isFlipped() {
      return document.getElementById('card-inner').classList.contains('flipped');
    }

    function rateCard(gotIt) {
      var card = studyQueue.shift(); /* remove the card on screen */
      if (!card) return;
      if (gotIt) {
        card.interval = Math.min((card.interval || 1) * 2, 30); /* double, cap at 30 */
        gotItCount++;
      } else {
        card.interval = 1;
        if (missedCards.indexOf(card) === -1) missedCards.push(card);
        studyQueue.push(card); /* to the END: it comes back around later */
      }
      loadCard();
    }

    /* The finished screen, with the tricky cards named. */
    function showDone() {
      showStudyPart('done');
      document.getElementById('done-title').textContent =
        totalCount === 1 ? 'Nice work. You got it.' : 'Nice work. You got all ' + totalCount + '.';

      var m = missedCards.length;
      var text = document.getElementById('done-text');
      var tricky = document.getElementById('btn-tricky');
      if (m === 0) {
        text.textContent = 'Every card on the first try.';
        tricky.hidden = true;
      } else {
        var names = missedCards.slice(0, 3).map(function(c) {
          return c.frontImg ? 'an image card' : (c.front || '').slice(0, 40).replace(/[.!?]+$/, '');
        });
        var list = names.length === 1 ? names[0]
                 : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
        if (m > 3) list = names.join(', ') + ' and ' + (m - 3) + ' more';
        text.textContent = plural(m, 'card') + ' took' + ' a second try: ' + list + '.';
        document.getElementById('btn-tricky-label').textContent =
          m === 1 ? 'Practice the tricky one' : 'Practice the tricky ' + m;
        tricky.hidden = false;
      }
    }


    /* -----------------------------------------------------------
     * MANAGE VIEW
     * ----------------------------------------------------------- */

    /* escapeHtml converts the five characters that have special meaning in
       HTML into their safe entity equivalents before injecting text via
       innerHTML. Without this, card text containing < > & ' " would
       break the card structure or create unintended HTML elements.
       e.g. "x < y" would inject a broken tag; "&amp;" renders as "&". */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g,  '&amp;')   /* & must come first to avoid double-escaping */
        .replace(/</g,  '&lt;')
        .replace(/>/g,  '&gt;')
        .replace(/"/g,  '&quot;')
        .replace(/'/g,  '&#39;');
    }


    function renderManageList() {
      var list  = document.getElementById('card-list');
      var empty = document.getElementById('empty-manage');
      list.innerHTML = '';

      if (cards.length === 0) {
        empty.hidden = false;
        if (activeDeckIdx >= 0) {
          empty.textContent = 'This deck has no cards. Press Add card to make one.';
        } else if (decks.length > 0) {
          empty.textContent = 'Pick a deck above to see its cards, or press Add card to start a new set.';
        } else {
          empty.textContent = 'No decks open. Use Open deck file to load a saved deck, or press Add card to start fresh.';
        }
        return;
      }
      empty.hidden = true;

      cards.forEach(function(card, index) {
        var item = document.createElement('li');
        item.className = 'card-item';
        item.draggable = true; /* drag a card onto another to reorder */
        item.title = 'Drag to reorder';

        item.addEventListener('dragstart', function(e) {
          dragSrcIndex = index;
          item.classList.add('dragging');
          if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
        });
        item.addEventListener('dragend', function() {
          item.classList.remove('dragging');
          document.querySelectorAll('.drop-target').forEach(function(el) { el.classList.remove('drop-target'); });
        });
        item.addEventListener('dragover', function(e) {
          e.preventDefault(); /* required for the drop event to fire */
          if (dragSrcIndex !== null && dragSrcIndex !== index) item.classList.add('drop-target');
        });
        item.addEventListener('dragleave', function() { item.classList.remove('drop-target'); });
        item.addEventListener('drop', function(e) {
          e.preventDefault();
          if (dragSrcIndex === null || dragSrcIndex === index) return;
          var moved = cards.splice(dragSrcIndex, 1)[0]; /* take it out... */
          cards.splice(index, 0, moved);                /* ...and put it here */
          dragSrcIndex = null;
          markDirty();
          renderManageList();
          renderContextLabel();
          renderDeckBar();
        });

        /* Text is shortened so cards stay tidy; the full text is in Edit. */
        function preview(img, text, cls) {
          if (img) return '<img src="' + img + '" alt="Card image">';
          var t = text || '';
          return '<p class="' + cls + '">' + escapeHtml(t.length > 90 ? t.substring(0, 90) + '…' : t) + '</p>';
        }

        item.innerHTML =
          '<div class="card-item-top">' +
            '<span class="card-num">' + svgIcon(ICON.grip, 14) + (index + 1) + '</span>' +
            '<span class="card-actions">' +
              '<button type="button" class="icon-btn" aria-label="Edit card ' + (index + 1) + '" onclick="openEditModal(' + index + ')">' + svgIcon(ICON.edit, 17) + '</button>' +
              '<button type="button" class="icon-btn" aria-label="Delete card ' + (index + 1) + '" onclick="deleteCard(' + index + ')">' + svgIcon(ICON.trash, 17) + '</button>' +
            '</span>' +
          '</div>' +
          preview(card.frontImg, card.front, 'card-front') +
          preview(card.backImg,  card.back,  'card-back');

        list.appendChild(item);
      });
    }

    function deleteCard(index) {
      if (!confirm('Delete this card?')) return;
      cards.splice(index, 1); /* remove one item at this index */
      markDirty();
      renderManageList();
      renderContextLabel();
      renderDeckBar();
      studyQueue = []; /* reset so deleted card never appears mid-session */
    }


    /* -----------------------------------------------------------
     * SHARED MODAL — Add Card and Edit Card
     * ----------------------------------------------------------- */

    var editIndex = null;      /* null = adding; a number = editing that card */
    var modalOpener = null;    /* the button that opened the dialog, to return focus */

    function openModal() {
      modalOpener = document.activeElement;
      document.getElementById('card-modal').hidden = false;
      document.getElementById('text-modal-front').focus();
    }

    /* openAddModal: New card mode, blank form */
    function openAddModal() {
      editIndex = null;
      clearDropZone('drop-modal-front', 'text-modal-front');
      clearDropZone('drop-modal-back',  'text-modal-back');
      document.getElementById('modal-title').textContent    = 'New card';
      document.getElementById('modal-save-btn').textContent = 'Save card';
      document.getElementById('add-another-row').hidden     = false;
      openModal();
    }

    /* openEditModal: Edit card mode, filled with the card's content */
    function openEditModal(index) {
      editIndex = index;
      var card  = cards[index];

      clearDropZone('drop-modal-front', 'text-modal-front');
      clearDropZone('drop-modal-back',  'text-modal-back');

      if (card.frontImg) showImageInZone('drop-modal-front', 'text-modal-front', card.frontImg);
      else document.getElementById('text-modal-front').value = card.front || '';

      if (card.backImg) showImageInZone('drop-modal-back', 'text-modal-back', card.backImg);
      else document.getElementById('text-modal-back').value = card.back || '';

      document.getElementById('modal-title').textContent    = 'Edit card';
      document.getElementById('modal-save-btn').textContent = 'Save changes';
      document.getElementById('add-another-row').hidden     = true;
      openModal();
    }

    /* saveModal handles both Add and Edit. */
    function saveModal() {
      var frontZone = document.getElementById('drop-modal-front');
      var backZone  = document.getElementById('drop-modal-back');
      var frontText = document.getElementById('text-modal-front').value.trim();
      var backText  = document.getElementById('text-modal-back').value.trim();
      var frontImg  = frontZone.dataset.imgData || null;
      var backImg   = backZone.dataset.imgData  || null;

      if (!frontImg && !frontText) { alert('Please add something to the front.'); return; }
      if (!backImg  && !backText)  { alert('Please add something to the back.');  return; }

      var adding = editIndex === null;
      if (adding) {
        cards.push({
          id:       Date.now(), /* millisecond timestamp: unique enough for an id */
          front:    frontText,
          back:     backText,
          frontImg: frontImg,
          backImg:  backImg,
          interval: 1
        });
      } else {
        /* keep the card's id and interval; replace its content */
        cards[editIndex].front    = frontText;
        cards[editIndex].back     = backText;
        cards[editIndex].frontImg = frontImg;
        cards[editIndex].backImg  = backImg;
      }

      markDirty();
      renderManageList();
      renderContextLabel();
      renderDeckBar(); /* updates the unsaved dot and card count */

      if (adding && document.getElementById('add-another').checked) {
        /* stay open for the next card */
        clearDropZone('drop-modal-front', 'text-modal-front');
        clearDropZone('drop-modal-back',  'text-modal-back');
        document.getElementById('text-modal-front').focus();
        showToast('Card added · ' + plural(cards.length, 'card'), 1600);
      } else {
        closeModal();
      }
    }

    function closeModal() {
      document.getElementById('card-modal').hidden = true;
      editIndex = null;
      if (modalOpener && document.body.contains(modalOpener)) modalOpener.focus();
      modalOpener = null;
    }


    /* -----------------------------------------------------------
     * EXPORT (SAVE DECK)
     * -----------------------------------------------------------
     * Resolves the deck name first, then branches on browser capability:
     *
     *   DECK NAME RESOLUTION
     *   ─────────────────────
     *   Named deck active  → use the existing deck name
     *   Scratchpad active  → prompt() the user for a name first,
     *                        then promote the scratchpad to a real deck
     *
     *   SAVE MECHANISM (after name is known)
     *   ──────────────────────────────────────
     *   Chrome / Edge  → showSaveFilePicker()
     *     Opens the OS native Save As dialog with the deck name
     *     pre-filled in the filename field. The user can navigate
     *     to any folder, change the name, or overwrite the original
     *     file. The browser writes directly to the chosen location.
     *     If the user picks the same filename as the original, the
     *     OS handles the overwrite confirmation automatically.
     *     After a successful write we also store the returned
     *     fileHandle on the deck object. A future "quick save"
     *     feature could use that handle to write silently without
     *     re-opening the dialog.
     *
     *   Firefox / other → blob download fallback
     *     Creates an in-memory file and triggers a browser download.
     *     The filename is pre-filled with the deck name so the file
     *     lands in Downloads with the correct name. The user would
     *     need to move it manually if they want it back in its
     *     original location. Not ideal but fully functional.
     *
     *   async / await
     *   ─────────────
     *   showSaveFilePicker() is asynchronous — it returns a Promise
     *   that resolves when the user finishes interacting with the
     *   dialog. We use async/await to write the code in a readable
     *   top-to-bottom style rather than chaining .then() callbacks.
     *   async before function() tells JS this function may pause
     *   and resume. await before an expression pauses execution
     *   until the Promise resolves, then continues with the result.
     *   The try/catch wrapping the picker call catches the case
     *   where the user clicks Cancel in the dialog — the browser
     *   throws an AbortError in that situation, which we silently
     *   ignore so the app doesn't show an error message.
     */

    /* showToast briefly displays a message at the bottom of the screen.
       msg     — the text to show e.g. "Deck saved ✓"
       duration — how long to show it in milliseconds (default 2200)

       How it works:
         1. Set the toast text
         2. Add .visible class  -> CSS opacity:1, toast fades in
         3. After `duration` ms, remove .visible -> CSS opacity:0, toast fades out
       clearTimeout(toastTimer) cancels any in-flight timer so that
       calling showToast() twice quickly doesn't leave a ghost toast visible. */
    var toastTimer = null; /* holds the setTimeout id so we can cancel it */

    function showToast(msg, duration) {
      duration = duration || 2200; /* default 2.2 seconds if not specified */
      var el = document.getElementById('save-toast');
      el.textContent = msg;        /* set the message text */
      el.classList.add('visible'); /* CSS: opacity transitions to 1 */

      clearTimeout(toastTimer);    /* cancel any previous dismiss timer */
      toastTimer = setTimeout(function() {
        el.classList.remove('visible'); /* CSS: opacity transitions back to 0 */
      }, duration);
      /* setTimeout is a built-in JS function that runs a callback after a delay.
         It returns a numeric id we store in toastTimer.
         clearTimeout(id) cancels that scheduled callback if it hasn't fired yet. */
    }


    async function exportJSON() {
      /* ── STEP 1: resolve the deck name ─────────────────────── */

      if (cards.length === 0) { alert('No cards to save.'); return; }

      var deckName;       /* the name used for the filename and deck entry */
      var isScratchpad = (activeDeckIdx === -1); /* true when saving from scratchpad */

      if (!isScratchpad) {
        /* named deck — name already known */
        deckName = decks[activeDeckIdx].name;

      } else if (!window.showSaveFilePicker) {
        /* FIREFOX SCRATCHPAD — prompt() is safe here because we are not
           going to call showSaveFilePicker() afterward.
           On Chrome/Edge, calling prompt() before showSaveFilePicker()
           consumes the user gesture token and causes a security error:
           "Must be handling a user gesture to show a file picker."
           Firefox does not have this restriction because it uses a
           plain blob download instead of the native file picker. */
        deckName = prompt('Name this deck:', 'My Deck');
        if (!deckName) return;
        deckName = deckName.trim();
        if (!deckName) { alert('Please enter a deck name.'); return; }
        var duplicate = decks.some(function(d) { return d.name === deckName; });
        if (duplicate) {
          alert('A deck named "' + deckName + '" is already loaded. Choose a different name.');
          return;
        }

      } else {
        /* CHROME/EDGE SCRATCHPAD — skip prompt() entirely.
           The file picker dialog IS the naming step: we suggest "My Deck"
           and the user renames it directly in the OS save dialog.
           After saving we read the chosen name back from handle.name.
           Using prompt() here would consume the user gesture and cause
           showSaveFilePicker() to throw a SecurityError. */
        deckName = 'My Deck'; /* placeholder — overwritten by handle.name after save */
      }

      /* ── STEP 2: build the JSON content ─────────────────────── */

      var json = JSON.stringify(cards, null, 2); /* 2 = 2-space indentation */
      var blob = new Blob([json], { type: 'application/json' }); /* in-memory file blob */

      /* ── STEP 3: write the file ──────────────────────────────── */

      /* THREE PATHS — checked in order of preference:
         A) deck has a stored fileHandle  → write directly, no dialog
         B) no handle, Chrome/Edge        → showSaveFilePicker dialog, store handle
         C) no handle, Firefox            → blob download to Downloads folder

         Path A is the fix for the deleted-card-reappears bug.
         When a deck is loaded via showOpenFilePicker (openLoadDecks),
         we store the FileSystemFileHandle on the deck object.
         Writing back through that same handle overwrites the original
         file in place — no navigation required, no dialog, no ambiguity
         about which file is being updated. */

      var pickerHandle   = null; /* will hold the handle from Path B if used — needed in Step 4 */
      var existingHandle = !isScratchpad && decks[activeDeckIdx].fileHandle
                           ? decks[activeDeckIdx].fileHandle
                           : null;
      /* existingHandle is the handle stored when the deck was loaded
         (or from a previous save via showSaveFilePicker).
         null when: scratchpad mode, Firefox load, or first-ever save. */

      if (existingHandle) {

        /* ── PATH A: direct write via stored handle — no dialog ── */

        try {
          var writable = await existingHandle.createWritable(); /* open write stream to the source file */
          await writable.write(blob); /* send blob content into the stream */
          await writable.close();     /* flush to disk — file not updated without this */
          /* silent save succeeded — show a brief toast so the user knows it happened */
          showToast('✓ ' + deckName + ' saved');
        } catch (err) {
          alert('Could not save the file: ' + err.message);
          return;
        }

      } else if (window.showSaveFilePicker) {

        /* ── PATH B: Chrome/Edge, no handle yet — Save As dialog ── */

        try {
          /* showSaveFilePicker opens the OS save dialog.
             suggestedName pre-fills the filename field with the deck name.
             The user can navigate anywhere and change the name.
             await pauses until they click Save or Cancel. */
          var handle = await window.showSaveFilePicker({
            suggestedName: deckName + '.json',
            types: [{ description: 'JSON Deck File', accept: { 'application/json': ['.json'] } }]
          });

          var writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();

          /* always capture the name the user typed in the dialog —
             they may have changed it from the suggestion.
             handle.name is the filename including .json e.g. "Biology 101.json" */
          var savedName = handle.name.replace(/\.json$/i, '');
          deckName      = savedName;  /* update for Step 4 and toast */
          pickerHandle  = handle;     /* store so Step 4 can attach it to the new deck */

          if (!isScratchpad) {
            /* named deck — update the live deck object immediately */
            decks[activeDeckIdx].fileHandle = handle;
            decks[activeDeckIdx].name       = savedName;
          }

        } catch (err) {
          if (err.name === 'AbortError') return; /* user cancelled */
          alert('Could not save the file: ' + err.message);
          return;
        }

      } else {

        /* ── PATH C: Firefox / fallback — blob download ─────────── */

        var url = URL.createObjectURL(blob);
        var a   = document.createElement('a');
        a.href     = url;
        a.download = deckName + '.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('\u2193 ' + deckName + '.json downloaded');
      }

      /* ── STEP 4: update app state after a successful save ────── */

      if (isScratchpad) {
        /* promote scratchpad to a named deck.
           pickerHandle = the FileSystemFileHandle from Path B, null from Path C.
           slice() copies scratchCards so clearing it below won't empty the new deck. */
        decks.push({
          name:       deckName,
          cards:      scratchCards.slice(),
          dirty:      false,
          fileHandle: pickerHandle   /* enables silent saves going forward */
        });
        activeDeckIdx = decks.length - 1;
        scratchCards  = [];
        syncCards();
      } else {
        clearDirty();
      }


      renderDeckBar();      /* update pill: remove • or show newly promoted deck */
      renderContextLabel(); /* update "Editing: Name (N cards)" label */
      renderManageList();   /* redraw card list under the now-clean deck context */
    }



    /* -----------------------------------------------------------
     * SAVE AS
     * -----------------------------------------------------------
     * Always opens a picker dialog regardless of whether the deck
     * already has a stored fileHandle.
     *
     * Chrome/Edge: showSaveFilePicker with the current deck name
     *   pre-filled. After saving, the returned handle replaces
     *   any existing fileHandle on the deck so future silent saves
     *   go to the new location. Deck name updates to match the
     *   filename the user chose.
     *
     * Firefox: blob download (same as the existing fallback).
     *
     * Scratchpad: same as exportJSON scratchpad path -- prompts
     *   for a name then promotes the scratchpad to a named deck.
     */
    async function saveAsJSON() {
      if (cards.length === 0) { alert('No cards to save.'); return; }

      /* resolve the deck name -- same branching logic as exportJSON step 1:
         prompt() is only called on Firefox (no showSaveFilePicker) because
         on Chrome calling prompt() before showSaveFilePicker() consumes
         the user gesture and causes a "Must be handling a user gesture" error */
      var deckName;
      var isScratchpad = (activeDeckIdx === -1);

      if (!isScratchpad) {
        deckName = decks[activeDeckIdx].name; /* pre-fill with current name */

      } else if (!window.showSaveFilePicker) {
        /* Firefox scratchpad -- prompt() is safe, no picker coming after */
        deckName = prompt('Name this deck:', 'My Deck');
        if (!deckName) return;
        deckName = deckName.trim();
        if (!deckName) { alert('Please enter a deck name.'); return; }
        var duplicate = decks.some(function(d) { return d.name === deckName; });
        if (duplicate) {
          alert('A deck named "' + deckName + '" is already loaded. Choose a different name.');
          return;
        }

      } else {
        /* Chrome/Edge scratchpad -- skip prompt(), let the OS dialog be the naming step */
        deckName = 'My Deck'; /* placeholder — overwritten by handle.name after save */
      }

      var json = JSON.stringify(cards, null, 2);
      var blob = new Blob([json], { type: 'application/json' });

      if (window.showSaveFilePicker) {

        /* Chrome / Edge -- always open the picker regardless of existing handle */
        try {
          var handle = await window.showSaveFilePicker({
            suggestedName: deckName + '.json', /* pre-fill with current name */
            types: [{ description: 'JSON Deck File', accept: { 'application/json': ['.json'] } }]
          });
          var writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();

          /* replace the stored handle with the one for the new location.
             Future silent saves via Save Deck will go to this new file. */
          if (!isScratchpad) {
            decks[activeDeckIdx].fileHandle = handle;
            var savedName = handle.name.replace(/\.json$/i, '');
            decks[activeDeckIdx].name = savedName;
            deckName = savedName; /* use the final saved name in the toast */
          }

        } catch (err) {
          if (err.name === 'AbortError') return; /* user cancelled */
          alert('Could not save the file: ' + err.message);
          return;
        }

      } else {

        /* Firefox -- blob download with the current deck name pre-filled */
        var url = URL.createObjectURL(blob);
        var a   = document.createElement('a');
        a.href     = url;
        a.download = deckName + '.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('↓ ' + deckName + '.json downloaded');
      }

      /* update app state -- same as exportJSON step 4 */
      if (isScratchpad) {
        decks.push({
          name:       deckName,
          cards:      scratchCards.slice(),
          dirty:      false,
          fileHandle: null
        });
        activeDeckIdx = decks.length - 1;
        scratchCards  = [];
        syncCards();
      } else {
        clearDirty();
        showToast('✓ ' + deckName + ' saved');
      }

      renderDeckBar();
      renderContextLabel();
      renderManageList();
    }

    /* -----------------------------------------------------------
     * KEYBOARD
     *   Study:  Space or Enter flips · 1 = Review again · 2 = Got it
     *   Dialog: Escape closes
     * Keys are ignored while typing in a text box.
     * ----------------------------------------------------------- */
    document.addEventListener('keydown', function(e) {
      var modalOpen = !document.getElementById('card-modal').hidden;
      if (modalOpen) {
        if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
        return;
      }

      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      var studying = document.getElementById('view-study').classList.contains('active') &&
                     !document.getElementById('study-deck').hidden;
      if (!studying) return;

      if (e.key === ' ' || e.key === 'Enter') {
        /* Buttons in the study area (the card, Shuffle, the rating
           buttons) already react to Space/Enter by themselves. */
        if (tag === 'button' && e.target.closest('#study-deck')) return;
        e.preventDefault();
        flipCard();
      } else if (isFlipped() && e.key === '1') {
        e.preventDefault();
        rateCard(false);
      } else if (isFlipped() && e.key === '2') {
        e.preventDefault();
        rateCard(true);
      }
    });


    /* -----------------------------------------------------------
     * STARTUP
     * ----------------------------------------------------------- */
    setupDropZone('drop-modal-front', 'text-modal-front', 'file-modal-front');
    setupDropZone('drop-modal-back',  'text-modal-back',  'file-modal-back');
    renderDeckBar();
    renderContextLabel();
    initStudy();
</script>
</body>
</html>
