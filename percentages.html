<!DOCTYPE html>
<!--
  PERCENTAGES  (part of Teacher Apps)
  =================================================================
  One self-contained file: structure (HTML), look (CSS) and
  behaviour (JavaScript) all live here. Nothing is loaded from the
  internet and nothing is saved or sent anywhere.

  Students count things into coloured rows (one row per category).
  "Calculate percentages" shows each count as a fraction, a decimal
  and a percentage of the total, with bar charts.

  How the file is laid out:
    1. <style>  ... design tokens, then one block per part of the page
    2. <body>   ... Teacher Apps header, total + grid size, category
                    rows, buttons, results
    3. <script> ... everything that makes it work
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Percentages · Teacher Apps</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231C2730'/%3E%3Crect x='8' y='8' width='10.5' height='10.5' rx='3' fill='%237FA6F0'/%3E%3Ccircle cx='26.75' cy='13.25' r='5.25' fill='%235FC49A'/%3E%3Crect x='8' y='21.5' width='10.5' height='10.5' rx='3' fill='%23E2AB4C'/%3E%3Crect x='21.5' y='21.5' width='10.5' height='10.5' rx='3' fill='%23EEF2F1'/%3E%3C/svg%3E">

<style>
/* =================================================================
   1. DESIGN TOKENS
   Shared Teacher Apps colours, plus this app's own colour (purple).
   ================================================================= */
:root {
  --paper:      #F5F7F6;
  --surface:    #FFFFFF;
  --surface-2:  #EEF2F1;
  --ink:        #1C2730;
  --ink-2:      #4A5862;
  --rule:       #D3DBDA;
  --field-edge: #85918F;
  --focus:      #1D5FD1;

  --app:        #73639F;  /* Percentages purple: stripe, main buttons */
  --app-bg:     #ECE7F5;  /* soft purple tint */
  --app-dark:   #5F5189;  /* hover for purple buttons */

  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}

/* =================================================================
   2. BASICS
   ================================================================= */
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--font); line-height: 1.5; }
h1, h2, h3, p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 999px;
  border: 1px solid var(--field-edge); background: var(--surface); color: var(--ink);
  font-size: 0.9375rem; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--app); border-color: var(--app); color: #FFFFFF; }
.btn-primary:hover { background: var(--app-dark); border-color: var(--app-dark); }
.btn-big { min-height: 52px; padding: 0 24px; font-size: 1.0625rem; }
.btn-dashed { min-height: 48px; border: 2px dashed var(--app); background: transparent; color: var(--app); }
.btn-dashed:hover { background: var(--app-bg); }

/* =================================================================
   3. TEACHER APPS HEADER
   ================================================================= */
.app-stripe { height: 4px; background: var(--app); }
.app-bar { border-bottom: 1px solid var(--rule); }
.app-bar-inner {
  max-width: 1060px; margin: 0 auto; padding: 14px 24px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;
}
.app-id { display: flex; align-items: center; gap: 14px; }
.home-link { display: inline-flex; border-radius: 10px; }
.logo-mark { width: 32px; height: 32px; padding: 6px; border-radius: 9px; background: #1C2730; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.logo-mark span:nth-child(1) { background: #7FA6F0; border-radius: 3px 3px 3px 1.5px; }
.logo-mark span:nth-child(2) { background: #5FC49A; border-radius: 50%; }
.logo-mark span:nth-child(3) { background: #E2AB4C; border-radius: 3px; }
.logo-mark span:nth-child(4) { background: #EEF2F1; border-radius: 3px 1.5px 3px 3px; }
.bar-divider { width: 1px; height: 24px; background: var(--rule); }
.app-name { display: inline-flex; align-items: center; gap: 10px; font-size: 1.125rem; font-weight: 700; letter-spacing: -0.01em; }
.app-icon { width: 32px; height: 32px; border-radius: 9px; background: var(--app-bg); display: inline-flex; align-items: center; justify-content: center; }
.app-icon svg { stroke: var(--app); }

/* =================================================================
   4. TOP CARDS: total + grid size
   ================================================================= */
main { max-width: 1060px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 20px; }
.top-row { display: flex; flex-wrap: wrap; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 20px; padding: 20px 24px; }
.total-panel { flex: 1 1 260px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.label { font-size: 0.875rem; font-weight: 600; color: var(--ink-2); }
.total-number { margin-top: 2px; font-size: 3.5rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.total-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--app-bg); display: flex; align-items: center; justify-content: center; }
.total-icon svg { stroke: var(--app); }
.size-panel { flex: 2 1 420px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.size-fields { display: flex; flex-wrap: wrap; gap: 12px 28px; }
.size-field { display: flex; align-items: center; gap: 10px; }
.size-field small { color: var(--ink-2); font-size: 0.8125rem; }

/* A − [number] + control, used for grid size and counts. */
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--field-edge); border-radius: 999px; background: var(--surface); overflow: hidden; }
.stepper button { width: 40px; height: 40px; border: 0; background: transparent; font-size: 1.25rem; line-height: 1; cursor: pointer; }
.stepper button:hover { background: var(--surface-2); }
.stepper input {
  width: 48px; height: 40px; border: 0; background: transparent;
  text-align: center; font-weight: 700; font-size: 1rem; font-variant-numeric: tabular-nums;
  -moz-appearance: textfield; appearance: textfield;
}
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* =================================================================
   5. CATEGORY ROWS
   ================================================================= */
.category-list { display: grid; gap: 12px; }
.category-row { background: var(--surface); border: 1px solid var(--rule); border-radius: 18px; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.category-header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }

/* Colour swatch and its pop-up palette. */
.swatch-wrap { position: relative; flex: none; }
.color-swatch { width: 36px; height: 36px; border-radius: 10px; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px var(--field-edge); cursor: pointer; display: block; }
.color-picker-popup {
  display: none; position: absolute; top: 46px; left: 0; z-index: 10;
  width: 232px; padding: 12px; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--rule);
  box-shadow: 0 20px 40px -16px rgba(28,39,48,0.35);
  grid-template-columns: repeat(5, 1fr); gap: 8px;
}
.color-picker-popup.open { display: grid; }
.color-option { width: 34px; height: 34px; border-radius: 9px; border: 2px solid #FFFFFF; box-shadow: 0 0 0 1px var(--rule); cursor: pointer; padding: 0; }
.color-option[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }

.category-name-input {
  flex: 1 1 200px; min-width: 0;
  font-size: 1.1875rem; font-weight: 700;
  border: 0; border-bottom: 1px dashed var(--rule); padding: 4px 2px; background: transparent;
}
.category-name-input:hover { border-bottom-color: var(--field-edge); }
.count-controls { display: flex; align-items: center; gap: 12px; }
.count-controls .stepper button { width: 44px; height: 44px; font-size: 1.375rem; }
.count-controls .stepper button.plus { background: var(--app-bg); }
.count-controls .stepper button.plus:hover { background: #DDD5EE; }
.count-controls .stepper input { height: 44px; font-size: 1.1875rem; font-weight: 750; }
.cap-badge { min-width: 56px; font-size: 0.875rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.btn-remove-category {
  width: 40px; height: 40px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
}
.btn-remove-category:hover { background: var(--surface-2); color: var(--ink); }

/* The row of cells. Clicking anywhere on it adds one. */
.cell-grid { display: grid; gap: 4px; cursor: pointer; }
.cell-grid.full { cursor: default; }
.cell { aspect-ratio: 1; border-radius: 7px; }

.actions { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }

/* =================================================================
   6. RESULTS
   ================================================================= */
.results-panel { display: none; background: var(--surface); border: 1px solid var(--rule); border-top: 6px solid var(--app); border-radius: 22px; padding: 28px 32px 32px; scroll-margin-top: 16px; }
.results-panel.show { display: block; }
.results-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 24px; }
.results-head h2 { font-size: 1.875rem; font-weight: 750; letter-spacing: -0.02em; }
.results-head p { color: var(--ink-2); }
.results-head strong { color: var(--ink); }
.table-wrap { margin-top: 20px; overflow-x: auto; }
.results-table { width: 100%; border-collapse: collapse; font-size: 1.0625rem; font-variant-numeric: tabular-nums; text-align: left; }
.results-table th { padding: 8px 12px; font-size: 0.8125rem; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.results-table td { padding: 14px 12px; border-top: 1px solid var(--rule); }
.results-table td:last-child { font-weight: 700; }
.category-cell { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.swatch-mini { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.results-table .total-row td { border-top: 2px solid var(--ink); background: var(--app-bg); font-weight: 750; }
.chart-title { margin: 32px 0 14px; font-size: 1.125rem; font-weight: 700; }
.stacked-bar { display: flex; height: 40px; gap: 3px; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.stacked-bar span { min-width: 0; }
.bar-chart { margin-top: 20px; display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(80px, 160px) minmax(0, 1fr) 64px; align-items: center; gap: 14px; }
.bar-label { font-size: 0.9375rem; font-weight: 600; overflow-wrap: anywhere; }
.bar-track { height: 22px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
@media (prefers-reduced-motion: reduce) { .bar-fill { transition: none; } }
.bar-value { font-size: 0.9375rem; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

footer { max-width: 1060px; margin: 0 auto; padding: 0 24px 40px; font-size: 0.875rem; color: var(--ink-2); }

@media (max-width: 600px) {
  .results-panel { padding: 22px 18px; }
  .total-number { font-size: 2.75rem; }
}
</style>
</head>

<body>

<!-- =================================================================
     TEACHER APPS HEADER
     ================================================================= -->
<div class="app-stripe" aria-hidden="true"></div>
<header class="app-bar">
  <div class="app-bar-inner">
    <div class="app-id">
      <a class="home-link" href="index.html" aria-label="Teacher Apps home">
        <span class="logo-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      </a>
      <span class="bar-divider" aria-hidden="true"></span>
      <h1 class="app-name">
        <span class="app-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></span>
        Percentages
      </h1>
    </div>
    <button type="button" class="btn" onclick="resetAll()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v6h6"/><path d="M5 15a8 8 0 1 0 2-8.5L4 10"/></svg>
      Reset counts
    </button>
  </div>
</header>

<main>

  <!-- =================================================================
       TOTAL + GRID SIZE
       The total is worked out from the rows; it can't be typed.
       Rows = number of categories (max 10). Columns = most any one
       category can hold (max 25).
       ================================================================= -->
  <div class="top-row">
    <div class="panel total-panel">
      <div>
        <p class="label">Total counted</p>
        <p class="total-number" id="total-number" aria-live="polite">0</p>
      </div>
      <span class="total-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></span>
    </div>
    <div class="panel size-panel">
      <p class="label">Grid size</p>
      <div class="size-fields">
        <div class="size-field">
          <label for="rows-input" class="label">Rows</label>
          <span class="stepper">
            <button type="button" aria-label="Fewer rows" onclick="stepSize('rows-input', -1)">−</button>
            <input type="number" id="rows-input" min="1" max="10" value="5" oninput="handleRowsChange()">
            <button type="button" aria-label="More rows" onclick="stepSize('rows-input', 1)">+</button>
          </span>
          <small>up to 10</small>
        </div>
        <div class="size-field">
          <label for="cols-input" class="label">Columns</label>
          <span class="stepper">
            <button type="button" aria-label="Fewer columns" onclick="stepSize('cols-input', -1)">−</button>
            <input type="number" id="cols-input" min="1" max="25" value="23" oninput="handleColumnsChange()">
            <button type="button" aria-label="More columns" onclick="stepSize('cols-input', 1)">+</button>
          </span>
          <small>up to 25</small>
        </div>
      </div>
    </div>
  </div>

  <!-- CATEGORY ROWS: buildCategoryRow() makes one per category. -->
  <div class="category-list" id="category-list"></div>

  <div class="actions">
    <button type="button" class="btn btn-dashed" id="btn-add-category" onclick="addCategory()">Add category</button>
    <button type="button" class="btn btn-primary btn-big" onclick="calculate()">Calculate percentages</button>
  </div>

  <!-- =================================================================
       RESULTS: hidden until Calculate is pressed, then kept up to date.
       ================================================================= -->
  <section class="results-panel" id="results-panel" aria-labelledby="results-heading">
    <div class="results-head">
      <h2 id="results-heading">Results</h2>
      <p>Out of <strong id="results-total">0</strong> counted</p>
    </div>
    <div class="table-wrap">
      <table class="results-table">
        <thead>
          <tr><th scope="col">Category</th><th scope="col">Count</th><th scope="col">Fraction</th><th scope="col">Decimal</th><th scope="col">Percentage</th></tr>
        </thead>
        <tbody id="results-tbody"></tbody>
      </table>
    </div>
    <h3 class="chart-title">How it splits up</h3>
    <!-- One bar split into every category's share. -->
    <div class="stacked-bar" id="stacked-bar" aria-hidden="true"></div>
    <div class="bar-chart" id="bar-chart"></div>
  </section>

</main>

<footer>Teacher Apps · Runs entirely in your browser. No data leaves your device.</footer>

<script>


    /* ============================================================
       PERCENTAGES (v3) — JavaScript
       ============================================================
       What's new vs v2:
         - The Total field is GONE. Total is now a computed value
           equal to the sum of every category's count (the running
           count of filled cells across the whole grid).
         - Rows capped at 10 (was 20), Columns capped at 25 (was 50).
         - Percentages are calculated using the dynamic total so
           every percentage row always sums to 100% (except when
           the grid is completely empty — see the renderResults
           function for the 0/0 handling).
       ============================================================ */


    /* -----------------------------------------------------------
       THE 20-COLOR PALETTE
       Soft, Teacher Apps tones. The first 5 still follow the
       gummy bear worksheet order (yellow, red, clear, green, orange).
       ----------------------------------------------------------- */
    var PALETTE = [
      '#EBC35C',  /* 0  yellow (honey) */
      '#E07A6F',  /* 1  red (coral) */
      '#E3D6B4',  /* 2  cream (sand) */
      '#6FAF8B',  /* 3  green (sage) */
      '#F0A066',  /* 4  orange (apricot) */
      '#6E9BD9',  /* 5  blue */
      '#9C86C9',  /* 6  purple */
      '#E58BB5',  /* 7  pink */
      '#5DB3A6',  /* 8  teal */
      '#A8835F',  /* 9  brown */
      '#D2679A',  /* 10 magenta */
      '#A9C766',  /* 11 lime */
      '#4E6A9A',  /* 12 navy */
      '#EE9A88',  /* 13 salmon */
      '#BCAAE0',  /* 14 lavender */
      '#9AA163',  /* 15 olive */
      '#6BBFCB',  /* 16 cyan */
      '#A65866',  /* 17 maroon */
      '#D9B25A',  /* 18 gold */
      '#A9B8C6'   /* 19 mist grey */
    ];

    /* Hard caps — tightened in v3 to match the worksheet's scale. */
    var MAX_ROWS = 10;
    var MAX_COLS = 25;


    /* -----------------------------------------------------------
       STATE — single source of truth for the whole app
       -----------------------------------------------------------
       Note: state.total is GONE. The total is derived from the
       categories themselves via getTotal() — see below.
       ----------------------------------------------------------- */
    var state = {
      rows:       5,        /* how many categories exist (= state.categories.length) */
      columns:    23,       /* max count any single category can hold (matches worksheet default) */
      categories: [],       /* array of {id, name, color, count} */
      calculated: false,    /* true once Calculate has been clicked */
      nextId:     1         /* incrementing id given to each new category */
    };


    /* -----------------------------------------------------------
       getTotal — compute the running total from every category's count
       -----------------------------------------------------------
       Array.reduce(callback, initialValue) walks every element of
       the array, accumulating a single result. We start at 0 and
       add each category's count to get the running sum.

       This replaces the v1/v2 state.total stored value — total is
       now a DERIVED value computed on demand whenever we need it.
       ----------------------------------------------------------- */
    function getTotal() {
      return state.categories.reduce(function(sum, cat) {
        return sum + cat.count;
      }, 0);
    }


    /* -----------------------------------------------------------
       hexToRgba — "#e4c14a" + alpha → "rgba(228,193,74,0.18)"
       Used to render EMPTY cells as a faint tint of the category
       color (matches the worksheet's pale color bands).
       ----------------------------------------------------------- */
    function hexToRgba(hex, alpha) {
      var h = hex.replace('#', '');
      if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      var r = parseInt(h.substr(0, 2), 16);
      var g = parseInt(h.substr(2, 2), 16);
      var b = parseInt(h.substr(4, 2), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }


    /* -----------------------------------------------------------
       init — runs once when the page loads
       Builds state.rows starter categories with default names and
       palette colors, then renders the page for the first time.
       ----------------------------------------------------------- */
    function init() {
      for (var i = 0; i < state.rows; i++) {
        state.categories.push({
          id:    state.nextId++,
          name:  'Category ' + (i + 1),
          color: PALETTE[i % PALETTE.length],
          count: 0
        });
      }
      renderCategoryList();
      renderTotal();
      updateAddButton();
    }


    /* -----------------------------------------------------------
       findCategory — look up a category object by id
       Returns the live object so changes mutate state directly.
       ----------------------------------------------------------- */
    function findCategory(id) {
      for (var i = 0; i < state.categories.length; i++) {
        if (state.categories[i].id === id) return state.categories[i];
      }
      return null;
    }


    /* -----------------------------------------------------------
       renderCategoryList — rebuild every category card
       Used for whole-list changes (add/remove/columns changed).
       Count changes use renderGrid instead so input focus survives.
       ----------------------------------------------------------- */
    function renderCategoryList() {
      var container = document.getElementById('category-list');
      container.innerHTML = '';
      state.categories.forEach(function(cat) {
        container.appendChild(buildCategoryRow(cat));
      });
    }


    /* Small helper: an inline SVG icon as an HTML string. */
    function svgIcon(path, size) {
      size = size || 18;
      return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" ' +
             'stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" ' +
             'aria-hidden="true">' + path + '</svg>';
    }
    var TRASH_ICON = '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>';
    var PLUS_ICON  = '<path d="M12 5v14M5 12h14"/>';

    /* stepSize — the − and + buttons beside Rows and Columns.
       They change the number box, then run the same handler as typing. */
    function stepSize(inputId, delta) {
      var input = document.getElementById(inputId);
      var n = (parseInt(input.value, 10) || 0) + delta;
      var max = parseInt(input.max, 10);
      if (n < 1 || n > max) return;
      input.value = n;
      if (inputId === 'rows-input') handleRowsChange();
      else handleColumnsChange();
    }

    /* -----------------------------------------------------------
       buildCategoryRow — construct one category card
       Returns a DOM element with all inputs and buttons wired up.
       ----------------------------------------------------------- */
    function buildCategoryRow(cat) {
      var row = document.createElement('div');
      row.className = 'category-row';
      row.dataset.categoryId = cat.id;

      /* ---------- HEADER LINE: swatch | name | − count + | "8 of 23" | delete ---------- */
      var header = document.createElement('div');
      header.className = 'category-header';

      /* COLOUR SWATCH (a button) with its pop-up palette beside it */
      var swatchWrap = document.createElement('div');
      swatchWrap.className = 'swatch-wrap';

      var swatch = document.createElement('button');
      swatch.type = 'button';
      swatch.className = 'color-swatch';
      swatch.style.background = cat.color;
      swatch.setAttribute('aria-label', 'Change colour for ' + (cat.name || 'this category'));
      swatch.setAttribute('aria-expanded', 'false');
      swatch.onclick = function(e) {
        e.stopPropagation();
        toggleColorPicker(cat.id);
      };

      var popup = document.createElement('div');
      popup.className = 'color-picker-popup';
      popup.id = 'color-picker-' + cat.id;
      popup.setAttribute('role', 'group');
      popup.setAttribute('aria-label', 'Colours');
      PALETTE.forEach(function(color, n) {
        var option = document.createElement('button');
        option.type = 'button';
        option.className = 'color-option';
        option.style.background = color;
        option.setAttribute('aria-label', 'Colour ' + (n + 1));
        option.setAttribute('aria-pressed', color === cat.color ? 'true' : 'false');
        option.onclick = function(e) {
          e.stopPropagation();
          changeColor(cat.id, color);
        };
        popup.appendChild(option);
      });
      swatchWrap.appendChild(swatch);
      swatchWrap.appendChild(popup);

      /* NAME INPUT */
      var nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.className = 'category-name-input';
      nameInput.value = cat.name;
      nameInput.setAttribute('aria-label', 'Category name');
      nameInput.oninput = function() {
        cat.name = nameInput.value;
        if (state.calculated) renderResults();
      };

      /* COUNT CONTROLS — − / number / + and the "8 of 23" badge */
      var controls = document.createElement('div');
      controls.className = 'count-controls';

      var stepper = document.createElement('span');
      stepper.className = 'stepper';

      var btnMinus = document.createElement('button');
      btnMinus.type = 'button';
      btnMinus.textContent = '−';
      btnMinus.setAttribute('aria-label', 'One fewer');
      btnMinus.onclick = function() { changeCount(cat.id, -1); };

      var countInput = document.createElement('input');
      countInput.type = 'number';
      countInput.className = 'count-input';
      countInput.min = '0';
      countInput.max = String(state.columns);
      countInput.value = cat.count;
      countInput.id = 'count-input-' + cat.id;
      countInput.setAttribute('aria-label', 'Count');
      countInput.oninput = function() {
        var n = parseInt(countInput.value, 10);
        if (isNaN(n) || n < 0) n = 0;
        if (n > state.columns) n = state.columns;   /* clamp to column cap */
        cat.count = n;
        countInput.value = n;
        renderGrid(cat.id);
        renderTotal();
        if (state.calculated) renderResults();
      };

      var btnPlus = document.createElement('button');
      btnPlus.type = 'button';
      btnPlus.className = 'plus';
      btnPlus.textContent = '+';
      btnPlus.setAttribute('aria-label', 'One more');
      btnPlus.onclick = function() { changeCount(cat.id, 1); };

      stepper.appendChild(btnMinus);
      stepper.appendChild(countInput);
      stepper.appendChild(btnPlus);

      var capBadge = document.createElement('span');
      capBadge.className = 'cap-badge';
      capBadge.id = 'cap-badge-' + cat.id;
      capBadge.textContent = cat.count + ' of ' + state.columns;

      controls.appendChild(stepper);
      controls.appendChild(capBadge);

      /* REMOVE BUTTON */
      var btnRemove = document.createElement('button');
      btnRemove.type = 'button';
      btnRemove.className = 'btn-remove-category';
      btnRemove.innerHTML = svgIcon(TRASH_ICON, 18);
      btnRemove.setAttribute('aria-label', 'Remove ' + (cat.name || 'this category'));
      btnRemove.title = 'Remove this category';
      btnRemove.onclick = function() { removeCategory(cat.id); };

      header.appendChild(swatchWrap);
      header.appendChild(nameInput);
      header.appendChild(controls);
      header.appendChild(btnRemove);

      row.appendChild(header);
      row.appendChild(buildCellGrid(cat));
      return row;
    }

    /* -----------------------------------------------------------
       buildCellGrid — create the row of cells for one category
       Always renders exactly state.columns cells. First cat.count
       are FILLED (full opacity), the rest are EMPTY (18% tint).
       A single click handler on the grid does the +1.
       ----------------------------------------------------------- */
    function buildCellGrid(cat) {
      var grid = document.createElement('div');
      grid.className = 'cell-grid';
      grid.id = 'grid-' + cat.id;
      grid.setAttribute('aria-hidden', 'true'); /* the − / + buttons do the same job */

      /* each cell shares the width, but never grows past 40px */
      grid.style.gridTemplateColumns = 'repeat(' + state.columns + ', minmax(0, 40px))';

      if (cat.count >= state.columns) grid.classList.add('full');

      grid.onclick = function() { changeCount(cat.id, 1); };

      for (var i = 0; i < state.columns; i++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.background = i < cat.count ? cat.color : hexToRgba(cat.color, 0.2);
        grid.appendChild(cell);
      }
      return grid;
    }

    /* -----------------------------------------------------------
       renderGrid — surgical update of one category's grid
       Walks existing cells and just changes their backgrounds — no
       DOM elements added or removed.
       ----------------------------------------------------------- */
    function renderGrid(catId) {
      var cat = findCategory(catId);
      if (!cat) return;
      var grid = document.getElementById('grid-' + catId);
      if (!grid) return;

      grid.classList.toggle('full', cat.count >= state.columns);

      var cells = grid.children;
      for (var i = 0; i < cells.length; i++) {
        if (i < cat.count) {
          cells[i].style.background = cat.color;
        } else {
          cells[i].style.background = hexToRgba(cat.color, 0.2);
        }
      }

      var badge = document.getElementById('cap-badge-' + catId);
      if (badge) badge.textContent = cat.count + ' of ' + state.columns;
    }


    /* -----------------------------------------------------------
       renderTotal — refresh the big running-total display
       Replaces v2's renderRunningTotal. The number is computed
       freshly via getTotal() — no stored state to keep in sync.
       ----------------------------------------------------------- */
    function renderTotal() {
      document.getElementById('total-number').textContent = getTotal();
    }


    /* -----------------------------------------------------------
       changeCount — +/- a category's count with cap enforcement
       Every count change in the app routes through this function.
       ----------------------------------------------------------- */
    function changeCount(catId, delta) {
      var cat = findCategory(catId);
      if (!cat) return;

      cat.count += delta;
      if (cat.count < 0) cat.count = 0;
      if (cat.count > state.columns) cat.count = state.columns;

      var input = document.getElementById('count-input-' + catId);
      if (input) input.value = cat.count;

      renderGrid(catId);
      renderTotal();
      if (state.calculated) renderResults();
    }


    /* -----------------------------------------------------------
       changeColor — pick a new color, refresh swatch + grid + results
       ----------------------------------------------------------- */
    function changeColor(catId, color) {
      var cat = findCategory(catId);
      if (!cat) return;
      cat.color = color;

      var row = document.querySelector('[data-category-id="' + catId + '"]');
      if (row) {
        var swatch = row.querySelector('.color-swatch');
        swatch.style.background = color;
        swatch.setAttribute('aria-expanded', 'false');
        swatch.focus();
        row.querySelectorAll('.color-option').forEach(function(o) {
          o.setAttribute('aria-pressed', o.style.background === swatch.style.background ? 'true' : 'false');
        });
        renderGrid(catId);
      }

      var popup = document.getElementById('color-picker-' + catId);
      if (popup) popup.classList.remove('open');

      if (state.calculated) renderResults();
    }

    /* -----------------------------------------------------------
       toggleColorPicker — open / close one swatch's popup
       Closes any other open pickers first.
       ----------------------------------------------------------- */
    function closeColorPickers() {
      document.querySelectorAll('.color-picker-popup.open').forEach(function(p) {
        p.classList.remove('open');
      });
      document.querySelectorAll('.color-swatch[aria-expanded="true"]').forEach(function(s) {
        s.setAttribute('aria-expanded', 'false');
      });
    }

    function toggleColorPicker(catId) {
      var target = document.getElementById('color-picker-' + catId);
      var wasOpen = target.classList.contains('open');
      closeColorPickers();
      if (!wasOpen) {
        target.classList.add('open');
        target.previousElementSibling.setAttribute('aria-expanded', 'true');
        var current = target.querySelector('[aria-pressed="true"]') || target.querySelector('button');
        if (current) current.focus();
      }
    }

    /* Clicking outside any swatch or palette closes it; so does Escape. */
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.swatch-wrap')) closeColorPickers();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape') return;
      var open = document.querySelector('.color-picker-popup.open');
      if (open) {
        closeColorPickers();
        open.previousElementSibling.focus();
      }
    });

    /* -----------------------------------------------------------
       addCategory — append one new row, bump state.rows
       Called by the "+ Add Category" button. Also kept in sync
       with the Rows input via handleRowsChange.
       ----------------------------------------------------------- */
    function addCategory() {
      if (state.categories.length >= MAX_ROWS) return;

      var color = PALETTE[state.categories.length % PALETTE.length];
      state.categories.push({
        id:    state.nextId++,
        name:  'Category ' + (state.categories.length + 1),
        color: color,
        count: 0
      });
      state.rows = state.categories.length;
      document.getElementById('rows-input').value = state.rows;

      renderCategoryList();
      renderTotal();
      updateAddButton();
      if (state.calculated) renderResults();
    }


    /* -----------------------------------------------------------
       removeCategory — drop one row, bump state.rows down by 1
       Confirms before destroying a category with a non-zero count.
       ----------------------------------------------------------- */
    function removeCategory(catId) {
      var cat = findCategory(catId);
      if (cat && cat.count > 0) {
        if (!confirm('Remove this category and its count of ' + cat.count + '?')) return;
      }

      var idx = state.categories.findIndex(function(c) { return c.id === catId; });
      if (idx === -1) return;
      state.categories.splice(idx, 1);
      state.rows = state.categories.length;
      document.getElementById('rows-input').value = state.rows;

      renderCategoryList();
      renderTotal();
      updateAddButton();
      if (state.calculated) renderResults();
    }


    /* -----------------------------------------------------------
       updateAddButton — enable/disable + relabel the Add button
       ----------------------------------------------------------- */
    function updateAddButton() {
      var btn = document.getElementById('btn-add-category');
      var full = state.categories.length >= MAX_ROWS;
      btn.disabled = full;
      btn.innerHTML = svgIcon(PLUS_ICON, 18) + (full ? 'Add category (10 is the most)' : 'Add category');
    }

    /* -----------------------------------------------------------
       handleRowsChange — teacher edits the Rows field
       Rows IS the number of categories — bumping it up appends,
       bumping it down removes from the end (with confirmation).
       ----------------------------------------------------------- */
    function handleRowsChange() {
      var input = document.getElementById('rows-input');
      var n = parseInt(input.value, 10);
      if (isNaN(n) || n < 1) n = 1;
      if (n > MAX_ROWS) n = MAX_ROWS;
      input.value = n;

      var current = state.categories.length;

      if (n > current) {
        for (var i = current; i < n; i++) {
          state.categories.push({
            id:    state.nextId++,
            name:  'Category ' + (i + 1),
            color: PALETTE[i % PALETTE.length],
            count: 0
          });
        }
      } else if (n < current) {
        var anyHasCount = false;
        for (var j = n; j < current; j++) {
          if (state.categories[j].count > 0) { anyHasCount = true; break; }
        }
        if (anyHasCount && !confirm('Removing these categories will delete their counts. Continue?')) {
          input.value = current;
          return;
        }
        state.categories.length = n;   /* truncate the array */
      }

      state.rows = n;
      renderCategoryList();
      renderTotal();
      updateAddButton();
      if (state.calculated) renderResults();
    }


    /* -----------------------------------------------------------
       handleColumnsChange — teacher edits the Columns field
       Clamps every count down to the new cap and rebuilds the grids.
       ----------------------------------------------------------- */
    function handleColumnsChange() {
      var input = document.getElementById('cols-input');
      var n = parseInt(input.value, 10);
      if (isNaN(n) || n < 1) n = 1;
      if (n > MAX_COLS) n = MAX_COLS;
      input.value = n;

      state.columns = n;

      state.categories.forEach(function(cat) {
        if (cat.count > n) cat.count = n;
      });

      renderCategoryList();
      renderTotal();
      if (state.calculated) renderResults();
    }


    /* -----------------------------------------------------------
       calculate — show the results panel and scroll into view
       Once shown, results auto-update as the student keeps clicking.
       ----------------------------------------------------------- */
    function calculate() {
      state.calculated = true;
      document.getElementById('results-panel').classList.add('show');
      renderResults();
      document.getElementById('results-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }


    /* -----------------------------------------------------------
       renderResults — rebuild the frequency table + bar chart
       -----------------------------------------------------------
       In v3 the denominator is getTotal() (sum of counts) rather
       than a teacher-typed total. Because of that, each category's
       percentage now represents its share of the actual placed
       counters — and every percentage row will sum to 100%
       (within rounding error) whenever any cells are filled.

       Special case: when total is 0 (no cells filled yet), every
       percentage is 0.0% — we guard against the 0/0 division by
       checking total > 0 before computing decimal.
       ----------------------------------------------------------- */
    function renderResults() {
      var tbody   = document.getElementById('results-tbody');
      var chart   = document.getElementById('bar-chart');
      var stacked = document.getElementById('stacked-bar');
      tbody.innerHTML = '';
      chart.innerHTML = '';
      stacked.innerHTML = '';

      var total = getTotal();              /* compute once and reuse */
      var sumCount = 0;
      var sumPercent = 0;
      document.getElementById('results-total').textContent = total;

      state.categories.forEach(function(cat) {
        /* GUARD against divide-by-zero when nothing is placed yet.
           In JS, 0 / 0 is NaN ("not a number"); checking total > 0
           first and falling back to 0 keeps the output meaningful. */
        var decimal = total > 0 ? cat.count / total : 0;
        var percent = decimal * 100;
        sumCount   += cat.count;
        sumPercent += percent;
        var name = cat.name || '(unnamed)';

        /* ---- TABLE ROW ---- */
        var tr = document.createElement('tr');

        var tdCat = document.createElement('td');
        var catCell = document.createElement('span');
        catCell.className = 'category-cell';
        var miniSwatch = document.createElement('span');
        miniSwatch.className = 'swatch-mini';
        miniSwatch.style.background = cat.color;
        catCell.appendChild(miniSwatch);
        catCell.appendChild(document.createTextNode(name));
        tdCat.appendChild(catCell);
        tr.appendChild(tdCat);

        [String(cat.count), cat.count + ' / ' + total, decimal.toFixed(3), percent.toFixed(1) + '%']
          .forEach(function(text) {
            var td = document.createElement('td');
            td.textContent = text;
            tr.appendChild(td);
          });
        tbody.appendChild(tr);

        /* ---- STACKED BAR PIECE (width = share of the total) ---- */
        if (cat.count > 0) {
          var piece = document.createElement('span');
          piece.style.flex = String(cat.count);
          piece.style.background = cat.color;
          piece.title = name + ': ' + percent.toFixed(1) + '%';
          stacked.appendChild(piece);
        }

        /* ---- BAR CHART ROW ---- */
        var bar = document.createElement('div');
        bar.className = 'bar-row';

        var label = document.createElement('div');
        label.className = 'bar-label';
        label.textContent = name;

        var track = document.createElement('div');
        track.className = 'bar-track';
        var fill = document.createElement('div');
        fill.className = 'bar-fill';
        fill.style.background = cat.color;
        fill.style.width = Math.min(percent, 100) + '%';
        track.appendChild(fill);

        var value = document.createElement('div');
        value.className = 'bar-value';
        value.textContent = percent.toFixed(1) + '%';

        bar.appendChild(label);
        bar.appendChild(track);
        bar.appendChild(value);
        chart.appendChild(bar);
      });

      /* ---- TOTAL ROW ----
         When total > 0, sumCount equals total and the percentages add
         up to 100%. The row is there so students can see that. */
      var totalTr = document.createElement('tr');
      totalTr.className = 'total-row';
      ['Total', String(sumCount), sumCount + ' / ' + total,
       total > 0 ? (sumCount / total).toFixed(3) : '0.000', sumPercent.toFixed(1) + '%']
        .forEach(function(text) {
          var td = document.createElement('td');
          td.textContent = text;
          totalTr.appendChild(td);
        });
      tbody.appendChild(totalTr);
    }

    /* -----------------------------------------------------------
       resetAll — zero every count, hide the results panel
       Keeps categories and grid dimensions intact.
       ----------------------------------------------------------- */
    function resetAll() {
      if (!confirm('Reset all counts back to zero?')) return;

      state.categories.forEach(function(cat) { cat.count = 0; });
      state.calculated = false;
      document.getElementById('results-panel').classList.remove('show');

      renderCategoryList();
      renderTotal();
    }


    /* ============================================================
       STARTUP
       ============================================================ */
    init();
</script>
</body>
</html>
